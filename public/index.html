<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./static/css/main.css" />
    <!--
      content-config.js is a placeholder during development (served from public/).
      When Access8MathWeb exports a website it overwrites this file with the
      user's content; scripts/pack.sh removes the placeholder before zipping.
      It is a classic script so it loads before main.js and sets
      window.contentConfig. Classic (non-module) scripts also work over file://,
      which module scripts do not.
    -->
    <script src="./content-config.js"></script>
    <title>Access8Math</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app" class="theme"></div>
    <script src="./static/js/main.js"></script>
  </body>
</html>
